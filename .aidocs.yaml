# .aidocs.yaml - aidocs self-documentation (dogfooding)
content: "docs/SUMMARY.md"

output:
  llms_txt: "llms.txt"
  llms_full: "docs/llms-full.txt"
  manifest: "docs/_ai/manifest.json"
  tags: "docs/_ai/tags.json"
  cache: "docs/_ai/.cache.json"

# AI disabled for reproducible builds
ai:
  enabled: false

project:
  name: "aidocs"
  description: "AI-optimized documentation generator for LLM-friendly discovery files"
  optimized_for:
    - "Claude Code"
    - "AI Agents"
    - "LLM Tools"
